[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncert-platform"
version = "0.1.0"
description = "NCERT textbook ingestion, review, and publishing platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3",
  "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2",
  "redis>=6.1,<7", "celery[redis]>=5.4,<6", "python-multipart>=0.0.12,<1",
  "PyMuPDF>=1.24,<2", "pdfplumber>=0.11,<1", "pytesseract>=0.3.13,<1",
  "Pillow>=13,<14", "boto3>=1.35,<2", "PyJWT>=2.9,<3", "pwdlib[argon2]>=0.2,<1",
  "prometheus-client>=0.21,<1", "structlog>=24.4,<26", "email-validator>=2.2,<3",
  "sentry-sdk[fastapi]>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "testcontainers[postgres,redis]>=4.8,<5", "ruff>=0.7,<1", "mypy>=1.13,<2", "pre-commit>=4,<5", "coverage>=7.6,<8", "pip-audit>=2.7,<3", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
